name: 24/7 Cloud Campaign Automation Engine

on:
  schedule:
    # Runs automatically every 10 minutes 24/7 in the GitHub Cloud
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-campaigns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Execute Flow Runner
        run: |
          cd dashboard
          npm install @supabase/supabase-js
          node scripts/cloud_flow_runner.mjs
